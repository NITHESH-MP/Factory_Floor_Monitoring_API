networks:
  factory-floor-monitoring-network:
services:

  postgres:
    image: postgres:16
    env_file:
      - app/.env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    
    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  fast-api:
    build: ./app
    env_file:
      - app/.env
    
    depends_on:
      postgres:
        condition: service_healthy

  flask-api:
    build: ./flask-api

    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine

    ports:
      - 80:80
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - fast-api
      - flask-api
  
volumes:
  postgres-data: