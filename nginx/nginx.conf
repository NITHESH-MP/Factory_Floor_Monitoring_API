events {}

http {
    server {
        listen 80;

        location /docs {
            proxy_pass http://fast-api:8000/docs;
        }

        location /openapi.json {
            proxy_pass http://fast-api:8000/openapi.json;
        }

        location /api/ {
            proxy_pass http://fast-api:8000;
        }

        location /auth/ {
            proxy_pass http://fast-api:8000/api/auth/;
        }

        location /machines/ {
            proxy_pass http://fast-api:8000/api/machines/;
        }

        location /maintenance/ {
            proxy_pass http://fast-api:8000/api/maintenance/;
        }

        location /readings/ {
            proxy_pass http://fast-api:8000/api/readings/;
        }

        location /reports/ {
            proxy_pass http://flask-api:5000/reports;
        }
    }
}